      }

        }

          opacity: 1;
        }
      }

      }
      .typing-dot-3 {

      }

      @keyframes hero-signal-move {
        0% {

        100% {
          left: 100%;
        }
      }

        animation: hero-signal-move 5.4s linear infinite;

          opacity: 0.6;
        }
        50% {
          transform: scale(1.35);
          opacity: 0;
        }

        0%, 100% {

          opacity: 0.85;
        }
        50% {
          transform: scale(1.18);
          opacity: 0.25;
        }
      }

      .animate-active-ring {
        animation: active-ring-pulse 1.8s ease-in-out infinite;
      }

        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animate-msg-enter {
        animation: msg-enter 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;

        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }

        let activeTimers = [];

        function clearTimers() {
          activeTimers.forEach((id) => window.clearTimeout(id));
          activeTimers = [];
          if (scoreRafId) {
            cancelAnimationFrame(scoreRafId);
            scoreRafId = 0;
          }
        }

        function prefersReducedMotion() {
          return (
            typeof window !== 'undefined' &&
            window.matchMedia &&
            window.matchMedia('(prefers-reduced-motion: reduce)').matches
          );
        }

        function schedule(fn, ms) {
          const id = window.setTimeout(fn, prefersReducedMotion() ? 30 : ms);
          activeTimers.push(id);
        }

        function escapeHtml(str) {
          return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function getActiveScenario() {
          return SCENARIOS.find((s) => s.id === state.activeScenarioId) || SCENARIOS[0];
        }

        function getActiveOutcome() {
          const sc = getActiveScenario();
          return sc.outcomes[state.outcomeKey] || Object.values(sc.outcomes)[0];
        }

        // 5. ACTIONS
        // ============================================================
        function goHome() {
          clearTimers();
          state.mode = 'home';
          state.showScenarioPicker = false;
          renderApp();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function startScenario(scenarioId, stepIdx = 0) {
          clearTimers();
          state.activeScenarioId = scenarioId;
          state.initialStepIndex = stepIdx;
          state.mode = 'simulation';

          const sc = getActiveScenario();
          const startStep = sc.steps[stepIdx];
          const startAgent = AGENTS.find((a) => a.id === startStep.agentId);

          state.currentStepIdx = stepIdx;
          state.askedOptionIds = [];
          state.isTransitioning = false;
          state.selectedBranch = sc.id === 'scenario-1' ? 'reallocate' : 'standard';
          state.isShiftFinished = false;
          state.allAgentsDone = false;
          state.messages = [];
          state.isTyping = true;
          state.typingAgentName = startAgent ? startAgent.name : 'Планировщик';
          state.panelFields = startStep.panelFields.map((f) => ({ ...f }));
          state.changedFieldKeys = startStep.panelFields.map((f) => f.key);
          state.activeReasoning = startStep.reasoning;
          state.stepLogs = [
            {
              stepNumber: startStep.stepNumber,
              agentId: startStep.agentId,
              reasoning: startStep.reasoning,
            },
          ];
          state.selectedLogStep = startStep.stepNumber;
          state.isJournalOpen = false;
          state.mobileTab = 'dialogue';
          state.hasUnreadAgentUpdate = false;
          state.arbitraryInput = '';
          state.prevActiveConveyorIdx = Math.max(
            0,
            AGENTS.findIndex((a) => a.id === startStep.agentId)
          );

          const map = {};
          startStep.panelFields.forEach((f) => {
            map[f.key] = f.value;
          });
          state.prevFieldMap = map;

          renderApp();
          window.scrollTo({ top: 0, behavior: 'smooth' });

          schedule(() => {
            state.isTyping = false;
            state.messages = [
              {
                id: `init-${sc.id}-${startStep.stepNumber}`,
                sender: 'system',
                agentId: startStep.agentId,
                agentName: startAgent ? startAgent.name : 'Планировщик',
                text: startStep.systemPrompt,
                animateIn: true,
              },
            ];
            if (startStep.isFinalStep && startStep.options.length === 0) {
              state.isShiftFinished = true;
              state.allAgentsDone = true;
            }
            updateSimulationDOM();
          }, 480);
        }

        function applyPanelUpdate(nextFields) {
          const changed = [];
          const nextMap = {};

          nextFields.forEach((f) => {
            nextMap[f.key] = f.value;
            if (state.prevFieldMap[f.key] !== f.value) {
              changed.push(f.key);
            }
          });

          if (changed.length === 0) {
            nextFields.forEach((f) => changed.push(f.key));
          }

          state.prevFieldMap = nextMap;
          state.panelFields = nextFields.map((f) => ({ ...f }));
          state.changedFieldKeys = changed;
          if (state.mobileTab === 'dialogue') {
            state.hasUnreadAgentUpdate = true;
          }

          schedule(() => {
            state.changedFieldKeys = [];
            const flashEls = document.querySelectorAll('.animate-field-flash');
            flashEls.forEach((el) => el.classList.remove('animate-field-flash'));
          }, 1800);
        }

        function upsertStepLog(entry) {
          const idx = state.stepLogs.findIndex((e) => e.stepNumber === entry.stepNumber);
          if (idx >= 0) {
            state.stepLogs[idx] = entry;
          } else {
            state.stepLogs.push(entry);
          }
          state.selectedLogStep = entry.stepNumber;
        }

        function handleOptionClick(optionId) {
          const sc = getActiveScenario();
          const currentStep = sc.steps[state.currentStepIdx];
          const option = currentStep.options.find((o) => o.id === optionId);
          if (!option || state.isTransitioning || state.isTyping || state.isShiftFinished) {
            return;
          }

          state.hasDismissedHint = true;
          state.isTransitioning = true;

          const activeAgent = AGENTS.find((a) => a.id === currentStep.agentId);
          const branchUsed = option.branchKey || state.selectedBranch;
          if (option.branchKey) {
            state.selectedBranch = option.branchKey;
          }

          state.messages.push({
            id: `u-${Date.now()}-${option.id}`,
            sender: 'master',
            text: option.text,
            animateIn: true,
          });
          state.typingAgentName = activeAgent ? activeAgent.name : 'Диспетчер';
          state.isTyping = true;
          updateSimulationDOM();

          schedule(() => {
            state.isTyping = false;
            // clear animateIn flag on older messages so they don't replay
            state.messages.forEach((m) => {
              m.animateIn = false;
            });

            state.messages.push({
              id: `s-${Date.now()}-${option.id}`,
              sender: 'system',
              agentId: currentStep.agentId,
              agentName: activeAgent ? activeAgent.name : 'Диспетчер',
              text: option.systemResponse,
              isComment: Boolean(option.returnsToButtons),
              animateIn: true,
            });

            if (option.updatedPanelFields) {
              applyPanelUpdate(option.updatedPanelFields);
            }

            if (option.updatedReasoning) {
              state.activeReasoning = option.updatedReasoning;
              upsertStepLog({
                stepNumber: currentStep.stepNumber,
                agentId: currentStep.agentId,
                reasoning: option.updatedReasoning,
              });
            }

            if (option.returnsToButtons) {
              state.askedOptionIds.push(option.id);
              state.isTransitioning = false;
              updateSimulationDOM();
              return;
            }

            if (currentStep.isFinalStep) {
              state.allAgentsDone = true;
              state.isShiftFinished = true;
              state.isTransitioning = false;
              updateSimulationDOM();
              return;
            }

            updateSimulationDOM();

            const nextIdx = state.currentStepIdx + 1;
            if (nextIdx < sc.steps.length) {
              const nextStep = sc.steps[nextIdx];
              const nextAgent = AGENTS.find((a) => a.id === nextStep.agentId);

              schedule(() => {
                state.typingAgentName = nextAgent ? nextAgent.name : 'Диспетчер';
                state.isTyping = true;
                updateSimulationDOM();

                schedule(() => {
                  state.isTyping = false;
                  state.messages.forEach((m) => {
                    m.animateIn = false;
                  });

                  const prevAgentId = sc.steps[state.currentStepIdx].agentId;
                  state.prevActiveConveyorIdx = Math.max(
                    0,
                    AGENTS.findIndex((a) => a.id === prevAgentId)
                  );
                  state.currentStepIdx = nextIdx;
                  state.askedOptionIds = [];

                  const override =
                    nextStep.branchOverrides && branchUsed
                      ? nextStep.branchOverrides[branchUsed]
                      : undefined;

                  const promptText = override ? override.systemPrompt : nextStep.systemPrompt;
                  const nextPanel = override ? override.panelFields : nextStep.panelFields;
                  const nextReasoning = override ? override.reasoning : nextStep.reasoning;

                  applyPanelUpdate(nextPanel);
                  state.activeReasoning = nextReasoning;
                  upsertStepLog({
                    stepNumber: nextStep.stepNumber,
                    agentId: nextStep.agentId,
                    reasoning: nextReasoning,
                  });

                  state.messages.push({
                    id: `step-${nextStep.stepNumber}-${Date.now()}`,
                    sender: 'system',
                    agentId: nextStep.agentId,
                    agentName: nextAgent ? nextAgent.name : 'Диспетчер',
                    text: promptText,
                    animateIn: true,
                  });

                  if (nextStep.isFinalStep && nextStep.options.length === 0) {
                    state.allAgentsDone = true;
                    state.isShiftFinished = true;
                  }

                  state.isTransitioning = false;
                  updateSimulationDOM();
                }, 500);
              }, 620);
            } else {
              state.allAgentsDone = true;
              state.isShiftFinished = true;
              state.isTransitioning = false;
              updateSimulationDOM();
            }
          }, 460);
        }

        function handleArbitrarySubmit(text) {
          const trimmed = text.trim();
          if (!trimmed || state.isTransitioning) return;

          state.hasDismissedHint = true;
          state.arbitraryInput = '';
          state.isTransitioning = true;

          state.messages.forEach((m) => {
            m.animateIn = false;
          });
          state.messages.push({
            id: `arb-u-${Date.now()}`,
            sender: 'master',
            text: trimmed,
            animateIn: true,
          });
          state.typingAgentName = 'Система';
          state.isTyping = true;
          updateSimulationDOM();

          schedule(() => {
            state.isTyping = false;
            state.messages.forEach((m) => {
              m.animateIn = false;
            });
            state.messages.push({
              id: `arb-s-${Date.now()}`,
              sender: 'system',
              agentName: 'Диспетчер смены',
              text: 'Это демо-стенд: здесь показан сценарий работы системы. Выберите один из примеров',
              isArbitraryFallback: true,
              animateIn: true,
            });
            state.isTransitioning = false;
            updateSimulationDOM();
          }, 360);
        }

          clearTimers();

                <button type="button" data-action="complete-shift" class="font-display inline-flex cursor-pointer items-center justify-center gap-2 rounded-lg bg-amber-400 px-6 py-3 text-sm font-bold text-slate-950 shadow-sm transition-colors hover:bg-amber-300 whitespace-nowrap shrink-0 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#1B3A6B]">
                  <span>Открыть итог смены</span>
                  ${ICONS.arrowRight('h-4 w-4')}
                </button>
              </div>
            `;
          }

          const optionsHtml = currentStep.options
            .map((opt) => {
              const alreadyAsked = state.askedOptionIds.includes(opt.id);
              const disabled =
                state.isTyping || state.isTransitioning || alreadyAsked;
              const cls = alreadyAsked
                ? 'cursor-not-allowed border-slate-200 bg-slate-100 text-slate-400 line-through'
                : disabled
                  ? 'cursor-wait border-slate-200 bg-white text-slate-400'
                  : 'cursor-pointer border-slate-300 bg-white text-slate-900 shadow-xs hover:border-[#1B3A6B] hover:bg-blue-50/50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#1B3A6B]';

              return `
                <button type="button" data-action="choose-option" data-option-id="${opt.id}" ${
                  disabled ? 'disabled' : ''
                } class="group flex w-full items-center justify-between gap-3 rounded-lg border px-4 py-3 text-left text-sm font-medium transition-all duration-150 ${cls}">
                  <span>${escapeHtml(opt.text)}</span>
                  ${
                    !alreadyAsked
                      ? ICONS.arrowRight(
                          'h-4 w-4 shrink-0 text-slate-400 transition-transform group-hover:translate-x-0.5 group-hover:text-[#1B3A6B]'
                        )
                      : ''
                  }
                </button>
              `;
            })
            .join('');

          return `
            <div>
              <p class="mb-2.5 text-xs font-semibold text-slate-500">Ваш ответ как мастера смены:</p>
              <div class="flex flex-col gap-2">${optionsHtml}</div>
            </div>
          `;
        }

        function buildAgentPanelHTML() {
          const sc = getActiveScenario();
          const currentStep = sc.steps[state.currentStepIdx];
          const activeAgent = AGENTS.find((a) => a.id === currentStep.agentId);

          const toneStyles = {
            neutral: 'text-slate-900',
            nominal: 'text-emerald-700',
            warning: 'text-amber-700',
            alert: 'text-red-700',
          };

          const fieldsHtml = state.panelFields
            .map((field) => {
              const isFlashing = state.changedFieldKeys.includes(field.key);
              return `
                <div class="flex items-baseline justify-between gap-4 rounded-lg border border-slate-200 bg-slate-50 px-3.5 py-2.5 transition-colors ${
                  isFlashing ? 'animate-field-flash' : ''
                }">
                  <span class="text-xs font-medium text-slate-600">${escapeHtml(field.label)}</span>
                  <span class="font-mono-tabular text-sm font-bold text-right ${
                    toneStyles[field.tone || 'neutral']
                  }">${escapeHtml(field.value)}</span>
                </div>
              `;
            })
            .join('');

          const displayedLog =
            state.stepLogs.find((l) => l.stepNumber === state.selectedLogStep) ||
            state.stepLogs[state.stepLogs.length - 1];

          const logTabsHtml =
            state.stepLogs.length > 1
              ? `<div class="flex flex-wrap gap-1.5">
                  ${state.stepLogs
                    .map((entry) => {
                      const ag = AGENTS.find((a) => a.id === entry.agentId);
                      const isSel = entry.stepNumber === state.selectedLogStep;
                      return `<button type="button" data-action="select-log-step" data-step="${entry.stepNumber}" class="cursor-pointer rounded-md border px-2.5 py-1 text-xs font-medium transition-colors whitespace-nowrap ${
                        isSel
                          ? 'border-[#1B3A6B] bg-[#1B3A6B] text-white'
                          : 'border-slate-200 bg-white text-slate-600 hover:border-slate-300'
                      }">${entry.stepNumber}. ${escapeHtml(ag ? ag.shortName : '')}</button>`;
                    })
                    .join('')}
                </div>`
              : '';

          const journalHtml = state.isJournalOpen
            ? `
              <div class="mt-3 space-y-4 text-sm">
                ${logTabsHtml}
                <div class="space-y-3 border-t border-slate-100 pt-3">
                  <div>
                    <span class="block text-xs font-semibold text-slate-500">Какой агент работал</span>
                    <p class="mt-0.5 font-semibold text-slate-900">
                      ${escapeHtml(displayedLog.reasoning.agentName)} (шаг ${displayedLog.stepNumber})
                    </p>
                  </div>
                  <div>
                    <span class="block text-xs font-semibold text-slate-500">Что получил на вход</span>
                    <p class="mt-0.5 leading-relaxed text-slate-700">${escapeHtml(displayedLog.reasoning.receivedInput)}</p>
                  </div>
                  <div>
                    <span class="block text-xs font-semibold text-slate-500">Что решил</span>
                    <p class="mt-0.5 leading-relaxed text-slate-700">${escapeHtml(displayedLog.reasoning.decisionLogic)}</p>
                  </div>
                  <div>
                    <span class="block text-xs font-semibold text-slate-500">Что передал дальше (структурированные данные)</span>
                    <dl class="mt-1.5 grid grid-cols-2 gap-x-3 gap-y-1.5 border-t border-slate-100 pt-2 text-xs">
                      <div>
                        <dt class="text-slate-500">Цех</dt>
                        <dd class="font-medium text-slate-900">${escapeHtml(displayedLog.reasoning.handoffPayload.workshop)}</dd>
                      </div>
                      <div>
                        <dt class="text-slate-500">План</dt>
                        <dd class="font-mono-tabular font-medium text-slate-900">${escapeHtml(displayedLog.reasoning.handoffPayload.plan)}</dd>
                      </div>
                      <div>
                        <dt class="text-slate-500">Факт</dt>
                        <dd class="font-mono-tabular font-medium text-slate-900">${escapeHtml(displayedLog.reasoning.handoffPayload.fact)}</dd>
                      </div>
                      <div>
                        <dt class="text-slate-500">Отклонение</dt>
                        <dd class="font-mono-tabular font-medium text-slate-900">${escapeHtml(displayedLog.reasoning.handoffPayload.deviation)}</dd>
                      </div>
                      <div>
                        <dt class="text-slate-500">Простой</dt>
                        <dd class="font-mono-tabular font-medium text-slate-900">${escapeHtml(displayedLog.reasoning.handoffPayload.downtimeMinutes)}</dd>
                      </div>
                      <div>
                        <dt class="text-slate-500">Классификатор</dt>
                        <dd class="font-medium text-slate-900">${escapeHtml(displayedLog.reasoning.handoffPayload.classifierReason)}</dd>
                      </div>
                    </dl>
                  </div>
                </div>
              </div>
            `
            : '';

          return `
            <div class="border-b border-slate-100 px-5 py-4">
              <div class="flex items-center justify-between gap-3">
                <span class="text-xs font-semibold text-[#1B3A6B]">Активный агент · ${activeAgent.order} из 6</span>
                <span class="font-mono-tabular text-xs text-slate-500">${escapeHtml(activeAgent.stageLabel)}</span>
              </div>
              <h2 class="font-display mt-1 text-xl font-bold text-slate-900">
                ${escapeHtml(activeAgent.name)}${
                  currentStep.secondaryAgentId === 'report' && state.allAgentsDone
                    ? ' → Отчёт'
                    : ''
                }
              </h2>
              <p class="mt-1 text-sm text-slate-600">${escapeHtml(activeAgent.roleSummary)}</p>
            </div>
            <div class="px-5 py-4">
              <p class="mb-3 text-xs font-semibold text-slate-500">Ключевые показатели шага</p>
              <div class="grid grid-cols-1 gap-2.5">${fieldsHtml}</div>
              <div class="mt-5 border-t border-slate-100 pt-4">
                <button type="button" data-action="toggle-journal" aria-expanded="${state.isJournalOpen}" class="flex w-full cursor-pointer items-center justify-between gap-2 rounded-lg border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm font-semibold text-[#1B3A6B] transition-colors hover:border-[#1B3A6B]/40 hover:bg-blue-50/40">
                  <span>Подробнее: как думали агенты</span>
                  ${
                    state.isJournalOpen
                      ? ICONS.chevronUp('h-4 w-4 shrink-0')
                      : ICONS.chevronDown('h-4 w-4 shrink-0')
                  }
                </button>
                ${journalHtml}
              </div>
            </div>
          `;
        }

        function renderSimulationView() {
          const sc = getActiveScenario();
          const showHint = !state.hasDismissedHint;

          return `
            <div class="min-h-[calc(100vh-61px)] bg-slate-50 pb-12">
              <section id="sim-header" class="text-white" style="background: linear-gradient(145deg, #1B3A6B 0%, #132B52 60%, #0D1F3C 100%);">
                ${buildSimulationHeaderHTML()}
              </section>

              <div class="mx-auto max-w-6xl px-4 pt-4 md:hidden">
                <div id="mobile-tabs" class="grid grid-cols-2 gap-1 rounded-lg border border-slate-200 bg-slate-100 p-1" role="tablist" aria-label="Режим просмотра">
                  <button type="button" role="tab" data-action="switch-tab" data-tab="dialogue" aria-selected="${state.mobileTab === 'dialogue'}" class="cursor-pointer rounded-md px-3 py-2 text-sm font-semibold transition-colors whitespace-nowrap ${
                    state.mobileTab === 'dialogue'
                      ? 'bg-white text-[#1B3A6B] shadow-sm'
                      : 'text-slate-600 hover:text-slate-900'
                  }">Диалог</button>
                  <button type="button" role="tab" data-action="switch-tab" data-tab="agents" aria-selected="${state.mobileTab === 'agents'}" class="cursor-pointer rounded-md px-3 py-2 text-sm font-semibold transition-colors whitespace-nowrap ${
                    state.mobileTab === 'agents'
                      ? 'bg-white text-[#1B3A6B] shadow-sm'
                      : 'text-slate-600 hover:text-slate-900'
                  }">Агенты${state.hasUnreadAgentUpdate ? ' (обновлено)' : ''}</button>
                </div>
              </div>

              <div class="mx-auto max-w-6xl px-4 pt-5 sm:px-6">
                <div id="hint-container">
                  ${
                    showHint
                      ? `<div class="mb-4 flex items-center justify-between gap-4 rounded-xl border border-amber-300 bg-amber-50 px-4 py-3 text-sm text-amber-950 shadow-sm">
                          <p class="font-medium">Вы — мастер смены: выбирайте реплики, а агенты покажут, как думает система</p>
                          <button type="button" data-action="dismiss-hint" aria-label="Скрыть подсказку" class="cursor-pointer rounded-md p-1 text-amber-800 transition-colors hover:bg-amber-200/60 shrink-0">${ICONS.x('h-4 w-4')}</button>
                        </div>`
                      : ''
                  }
                </div>

                <div class="grid grid-cols-1 gap-6 md:grid-cols-12 md:items-start">
                  <div id="dialogue-column" class="md:col-span-7 flex flex-col rounded-xl border border-slate-200 bg-white shadow-sm ${
                    state.mobileTab === 'dialogue' ? 'flex' : 'hidden md:flex'
                  }">
                    <div class="border-b border-slate-100 px-5 py-3 flex flex-wrap items-center justify-between gap-2">
                      <span class="text-xs font-semibold text-slate-500">Команда запуска:</span>
                      <span class="font-mono-tabular text-xs text-slate-700">«${escapeHtml(sc.launchCommand)}»</span>
                    </div>

                    <div id="messages-feed" class="flex-1 space-y-4 px-5 py-5 max-h-[460px] min-h-[300px] overflow-y-auto">
                      ${buildMessagesFeedHTML()}
                    </div>

                    <div class="border-t border-slate-200 bg-slate-50/70 px-5 py-4">
                      <div id="reply-area">${buildReplyAreaHTML()}</div>

                      <form id="arbitrary-form" class="mt-4 flex items-center gap-2 border-t border-slate-200/80 pt-3.5">
                        <label for="arbitrary-reply" class="sr-only">Произвольная реплика</label>
                        <input id="arbitrary-reply" type="text" value="${escapeHtml(state.arbitraryInput)}" placeholder="Написать произвольную реплику…" class="min-w-0 flex-1 rounded-lg border border-slate-300 bg-white px-3.5 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-[#1B3A6B] focus:outline-none" />
                        <button id="arbitrary-submit" type="submit" disabled class="inline-flex cursor-pointer items-center gap-1.5 rounded-lg border border-slate-300 bg-white px-3.5 py-2 text-sm font-semibold text-slate-700 transition-colors hover:border-slate-400 hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50 whitespace-nowrap shrink-0">
                          ${ICONS.send('h-3.5 w-3.5')}
                          <span class="hidden sm:inline">Отправить</span>
                        </button>
                      </form>
                    </div>
                  </div>

                  <aside id="agent-panel" class="md:col-span-5 rounded-xl border border-slate-200 bg-white shadow-sm ${
                    state.mobileTab === 'agents' ? 'block' : 'hidden md:block'
                  }">
                    ${buildAgentPanelHTML()}
                  </aside>
                </div>
              </div>
            </div>
          `;
        }

        function animateSignalDot() {
          const dot = document.getElementById('progress-signal-dot');
          if (!dot) return;
          const target = dot.getAttribute('data-target-left');
          if (!target) return;
          requestAnimationFrame(() => {
            dot.style.left = target;
          });
        }

        function updateSimulationDOM() {
          if (state.mode !== 'simulation') return;

          const headerEl = document.getElementById('sim-header');
          if (headerEl) {
            headerEl.innerHTML = buildSimulationHeaderHTML();
            animateSignalDot();
          }

          const hintEl = document.getElementById('hint-container');
          if (hintEl && state.hasDismissedHint) {
            hintEl.innerHTML = '';
          }

          const feedEl = document.getElementById('messages-feed');
          if (feedEl) {
            feedEl.innerHTML = buildMessagesFeedHTML();
            const endMarker = document.getElementById('messages-end');
            if (endMarker) {
              endMarker.scrollIntoView({ behavior: 'smooth', block: 'end' });
            }
          }

          const replyEl = document.getElementById('reply-area');
          if (replyEl) {
            replyEl.innerHTML = buildReplyAreaHTML();
          }

          const panelEl = document.getElementById('agent-panel');
          if (panelEl) {
            panelEl.innerHTML = buildAgentPanelHTML();
          }

          const tabsEl = document.getElementById('mobile-tabs');
          if (tabsEl) {
            const tabButtons = tabsEl.querySelectorAll('[data-action="switch-tab"]');
            tabButtons.forEach((btn) => {
              const t = btn.getAttribute('data-tab');
              const active = state.mobileTab === t;
              btn.setAttribute('aria-selected', String(active));
              btn.className = `cursor-pointer rounded-md px-3 py-2 text-sm font-semibold transition-colors whitespace-nowrap ${
                active
                  ? 'bg-white text-[#1B3A6B] shadow-sm'
                  : 'text-slate-600 hover:text-slate-900'
              }`;
              if (t === 'agents') {
                btn.textContent = `Агенты${state.hasUnreadAgentUpdate ? ' (обновлено)' : ''}`;
              }
            });
          }

          const diagCol = document.getElementById('dialogue-column');
          const agentCol = document.getElementById('agent-panel');
          if (diagCol && agentCol) {
            diagCol.className = `md:col-span-7 flex flex-col rounded-xl border border-slate-200 bg-white shadow-sm ${
              state.mobileTab === 'dialogue' ? 'flex' : 'hidden md:flex'
            }`;
            agentCol.className = `md:col-span-5 rounded-xl border border-slate-200 bg-white shadow-sm ${
              state.mobileTab === 'agents' ? 'block' : 'hidden md:block'
            }`;
          }

          const submitBtn = document.getElementById('arbitrary-submit');
          const inputEl = document.getElementById('arbitrary-reply');
          if (submitBtn && inputEl) {
            submitBtn.disabled = !inputEl.value.trim() || state.isTransitioning;
          }
        }

        function renderOutcomeView() {
          const sc = getActiveScenario();
          const outcome = getActiveOutcome();
          const otherScenarios = SCENARIOS.filter((s) => s.id !== sc.id);

          const downtimeHtml = outcome.downtimeChronology
            .map(
              (item, idx) => `
              <li class="flex items-start gap-3 border-t border-slate-100 pt-3 first:border-t-0 first:pt-0 text-sm leading-relaxed text-slate-700">
                <span class="font-mono-tabular mt-0.5 text-xs font-bold text-[#1B3A6B]">0${idx + 1}.</span>
                <span>${escapeHtml(item)}</span>
              </li>
            `
            )
            .join('');

          const conclusionsHtml = outcome.conclusions
            .map(
              (line) => `
              <li class="flex items-start gap-2.5 text-sm leading-relaxed text-slate-700">
                ${ICONS.checkCircle2('mt-0.5 h-4 w-4 shrink-0 text-[#1B3A6B]')}
                <span>${escapeHtml(line)}</span>
              </li>
            `
            )
            .join('');

          const recsHtml = outcome.recommendations
            .map(
              (rec, idx) => `
              <li class="flex items-start gap-2.5 text-sm leading-relaxed text-slate-700">
                <span class="font-mono-tabular mt-0.5 text-xs font-bold text-[#1B3A6B]">${idx + 1}.</span>
                <span>${escapeHtml(rec)}</span>
              </li>
            `
            )
            .join('');

          const pickerHtml = state.showScenarioPicker
            ? `<div id="outcome-scenario-picker" class="grid grid-cols-1 gap-4 pt-2 sm:grid-cols-2">
                ${otherScenarios
                  .map(
                    (s) => `
                    <button type="button" data-action="start-scenario" data-scenario="${s.id}" class="flex cursor-pointer items-center justify-between gap-4 rounded-xl border border-slate-200 bg-white p-4 text-left shadow-sm transition-all hover:border-[#1B3A6B] hover:shadow-md">
                      <div>
                        <span class="text-xs font-medium text-slate-500">Сценарий ${s.number} · ${escapeHtml(s.workshop)} · ${s.stepsCount} шагов</span>
                        <p class="font-display mt-1 text-base font-bold text-slate-900">${escapeHtml(s.title)}</p>
                      </div>
                      ${ICONS.arrowRight('h-4 w-4 shrink-0 text-[#1B3A6B]')}
                    </button>
                  `
                  )
                  .join('')}
              </div>`
            : `<div id="outcome-scenario-picker"></div>`;

          return `
            <main class="min-h-[calc(100vh-61px)] bg-slate-50 pb-16">
              <section class="text-white" style="background: linear-gradient(145deg, #1B3A6B 0%, #132B52 55%, #0A1830 100%);">
                <div class="mx-auto max-w-6xl px-4 py-10 sm:px-6 sm:py-12">
                  <div class="flex flex-col gap-8 lg:flex-row lg:items-center lg:justify-between">
                    <div class="max-w-2xl">
                      <p class="text-xs font-semibold tracking-wide text-sky-200">
                        Агент «Отчёт» · Итог смены
                      </p>
                      <h1 class="font-display mt-2 text-3xl font-bold tracking-tight text-white sm:text-4xl">
                        Итог смены: ${escapeHtml(sc.title)}
                      </h1>
                      <p class="mt-2 text-sm text-slate-200">${escapeHtml(outcome.shiftLabel)}</p>
                    </div>
                    <div class="flex items-center gap-5 rounded-xl border border-white/20 bg-white/10 px-6 py-5 shrink-0">
                      <div>
                        <span class="block text-xs font-medium text-sky-200">Балл смены</span>
                        <div class="mt-1 flex items-baseline gap-1.5">
                          <span id="outcome-score-counter" class="font-mono-tabular text-5xl font-bold text-amber-300">0</span>
                          <span class="font-mono-tabular text-lg font-medium text-slate-300">/ 100</span>
                        </div>
                      </div>
                      <div class="border-l border-white/20 pl-5 max-w-[190px]">
                        <span class="block text-xs font-semibold text-white">${escapeHtml(outcome.scoreVerdict)}</span>
                        <span class="mt-1 block text-xs text-slate-300">Зачёт только по годной продукции</span>
                      </div>
                    </div>
                  </div>
                  <div class="mt-8 border-t border-white/15 pt-6">
                    ${renderConveyor({ mode: 'progress', allCompleted: true })}
                  </div>
                </div>
              </section>

              <div class="mx-auto max-w-6xl px-4 pt-8 sm:px-6">
                <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
                  <section class="animate-outcome-reveal rounded-xl border border-slate-200 bg-white p-6 shadow-sm" style="animation-delay: 0.15s">
                    <h2 class="text-xs font-semibold text-slate-500">План и факт</h2>
                    <p class="font-display mt-2 text-xl font-bold text-slate-900 tabular-nums">${escapeHtml(outcome.planFact)}</p>
                    ${
                      outcome.extraQualityLine
                        ? `<p class="mt-2 text-sm font-medium text-slate-700">${escapeHtml(outcome.extraQualityLine)}</p>`
                        : ''
                    }
                  </section>

                  <section class="animate-outcome-reveal rounded-xl border border-slate-200 bg-white p-6 shadow-sm" style="animation-delay: 0.35s">
                    <h2 class="text-xs font-semibold text-slate-500">Отклонение от графика</h2>
                    <p class="font-display mt-2 text-xl font-bold text-slate-900 tabular-nums">${escapeHtml(outcome.deviation)}</p>
                    <p class="mt-2 text-sm text-slate-600">
                      Допуск системы: −10%. Статус зафиксирован агентом «Контролёр».
                    </p>
                  </section>
                </div>

                <section class="animate-outcome-reveal mt-6 rounded-xl border border-slate-200 bg-white p-6 shadow-sm" style="animation-delay: 0.55s">
                  <h2 class="font-display text-lg font-bold text-slate-900">Хронология простоев и причины</h2>
                  <ul class="mt-4 space-y-3">${downtimeHtml}</ul>
                </section>

                <div class="mt-6 grid grid-cols-1 gap-6 md:grid-cols-2">
                  <section class="animate-outcome-reveal rounded-xl border border-slate-200 bg-white p-6 shadow-sm" style="animation-delay: 0.75s">
                    <h2 class="font-display text-lg font-bold text-slate-900">Выводы по смене</h2>
                    <ul class="mt-4 space-y-2.5">${conclusionsHtml}</ul>
                  </section>

                  <section class="animate-outcome-reveal rounded-xl border border-slate-200 bg-white p-6 shadow-sm" style="animation-delay: 0.95s">
                    <h2 class="font-display text-lg font-bold text-slate-900">Рекомендации на следующую смену</h2>
                    <ul class="mt-4 space-y-2.5">${recsHtml}</ul>
                  </section>
                </div>

                <section class="animate-outcome-reveal mt-6 rounded-xl border border-slate-200 bg-white p-5 shadow-sm" style="animation-delay: 1.1s">
                  <p class="text-xs font-semibold text-slate-500">Сформированная запись журнала (формат вывода системы)</p>
                  <p class="font-mono-tabular mt-2 text-xs leading-relaxed text-slate-800">${escapeHtml(outcome.formattedSummary)}</p>
                </section>

                <div class="animate-outcome-reveal mt-8 flex flex-col gap-4" style="animation-delay: 1.2s">
                  <div class="flex flex-wrap items-center gap-3">
                    <button type="button" data-action="toggle-outcome-picker" class="font-display inline-flex cursor-pointer items-center gap-2 rounded-lg bg-[#1B3A6B] px-6 py-3 text-sm font-bold text-white shadow-sm transition-colors hover:bg-[#142D54] whitespace-nowrap focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#1B3A6B]">
                      <span>Пройти другой сценарий</span>
                      ${ICONS.arrowRight('h-4 w-4')}
                    </button>

                    <button type="button" data-action="go-home" class="inline-flex cursor-pointer items-center gap-2 rounded-lg border border-slate-300 bg-white px-5 py-3 text-sm font-semibold text-slate-700 transition-colors hover:border-slate-400 hover:bg-slate-50 whitespace-nowrap focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#1B3A6B]">
                      <span>Вернуться на главную</span>
                    </button>

                    ${
                      sc.id === 'scenario-1'
                        ? `<button type="button" data-action="replay-step5" class="inline-flex cursor-pointer items-center gap-2 rounded-lg border border-amber-300 bg-amber-50 px-4 py-3 text-sm font-semibold text-amber-950 transition-colors hover:bg-amber-100 whitespace-nowrap">
                            ${ICONS.rotateCcw('h-4 w-4')}
                            <span>Переиграть шаг 5 (другое решение)</span>
                          </button>`
                        : ''
                    }
                  </div>
                  ${pickerHtml}
                </div>
              </div>
            </main>
          `;
        }

        function startScoreCounter(targetScore) {
          const el = document.getElementById('outcome-score-counter');
          if (!el) return;

          if (prefersReducedMotion()) {
            el.textContent = String(targetScore);
            return;
          }

          const duration = 1100;
          const start = performance.now();

          function tick(now) {
            const elapsed = now - start;
            const t = Math.min(1, elapsed / duration);
            const eased = 1 - Math.pow(1 - t, 3);
            el.textContent = String(Math.round(eased * targetScore));
            if (t < 1) {
              scoreRafId = requestAnimationFrame(tick);
            }
          }

          el.textContent = '0';
          scoreRafId = requestAnimationFrame(tick);
        }

        // ============================================================
        // 7. ROOT RENDER & EVENT DELEGATION
        // ============================================================
        function renderApp() {
          const root = document.getElementById('root');
          if (!root) return;

          let bodyHtml = '';
          if (state.mode === 'home') {
            bodyHtml = renderHomeView();
          } else if (state.mode === 'simulation') {
            bodyHtml = renderSimulationView();
          } else {
            bodyHtml = renderOutcomeView();
          }

          root.innerHTML = `
            <div class="min-h-screen bg-slate-50 text-slate-900 flex flex-col">
              ${renderTopBar()}
              ${bodyHtml}
            </div>
          `;

          if (state.mode === 'simulation') {
            animateSignalDot();
          } else if (state.mode === 'outcome') {
            startScoreCounter(getActiveOutcome().score);
          }
        }

        document.addEventListener('click', (e) => {
          const btn = e.target.closest('[data-action]');
          if (!btn) return;
          const action = btn.getAttribute('data-action');

          if (action === 'go-home') {
            goHome();
          } else if (action === 'start-scenario') {
            const id = btn.getAttribute('data-scenario');
            if (id) startScenario(id, 0);
          } else if (action === 'scroll') {
            const targetId = btn.getAttribute('data-target');
            const el = targetId && document.getElementById(targetId);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          } else if (action === 'dismiss-hint') {
            state.hasDismissedHint = true;
            const hintEl = document.getElementById('hint-container');
            if (hintEl) hintEl.innerHTML = '';
          } else if (action === 'choose-option') {
            const optId = btn.getAttribute('data-option-id');
            if (optId) handleOptionClick(optId);
          } else if (action === 'complete-shift') {
            completeShift();
          } else if (action === 'toggle-journal') {
            state.isJournalOpen = !state.isJournalOpen;
            const panelEl = document.getElementById('agent-panel');
            if (panelEl) panelEl.innerHTML = buildAgentPanelHTML();
          } else if (action === 'select-log-step') {
            const stepNum = Number(btn.getAttribute('data-step'));
            if (!Number.isNaN(stepNum)) {
              state.selectedLogStep = stepNum;
              const panelEl = document.getElementById('agent-panel');
              if (panelEl) panelEl.innerHTML = buildAgentPanelHTML();
            }
          } else if (action === 'switch-tab') {
            const tab = btn.getAttribute('data-tab');
            if (tab === 'dialogue' || tab === 'agents') {
              state.mobileTab = tab;
              if (tab === 'agents') state.hasUnreadAgentUpdate = false;
              updateSimulationDOM();
            }
          } else if (action === 'toggle-outcome-picker') {
            state.showScenarioPicker = !state.showScenarioPicker;
            const pickerEl = document.getElementById('outcome-scenario-picker');
            if (pickerEl) {
              const sc = getActiveScenario();
              const otherScenarios = SCENARIOS.filter((s) => s.id !== sc.id);
              pickerEl.outerHTML = state.showScenarioPicker
                ? `<div id="outcome-scenario-picker" class="grid grid-cols-1 gap-4 pt-2 sm:grid-cols-2">
                    ${otherScenarios
                      .map(
                        (s) => `
                        <button type="button" data-action="start-scenario" data-scenario="${s.id}" class="flex cursor-pointer items-center justify-between gap-4 rounded-xl border border-slate-200 bg-white p-4 text-left shadow-sm transition-all hover:border-[#1B3A6B] hover:shadow-md">
                          <div>
                            <span class="text-xs font-medium text-slate-500">Сценарий ${s.number} · ${escapeHtml(s.workshop)} · ${s.stepsCount} шагов</span>
                            <p class="font-display mt-1 text-base font-bold text-slate-900">${escapeHtml(s.title)}</p>
                          </div>
                          ${ICONS.arrowRight('h-4 w-4 shrink-0 text-[#1B3A6B]')}
                        </button>
                      `
                      )
                      .join('')}
                  </div>`
                : `<div id="outcome-scenario-picker"></div>`;
            }
          } else if (action === 'replay-step5') {
            startScenario('scenario-1', 4);
          }
        });

        document.addEventListener('input', (e) => {
          if (e.target && e.target.id === 'arbitrary-reply') {
            state.arbitraryInput = e.target.value;
            const submitBtn = document.getElementById('arbitrary-submit');
            if (submitBtn) {
              submitBtn.disabled = !state.arbitraryInput.trim() || state.isTransitioning;
            }
          }
        });

        document.addEventListener('submit', (e) => {
          if (e.target && e.target.id === 'arbitrary-form') {
            e.preventDefault();
            const inputEl = document.getElementById('arbitrary-reply');
            if (inputEl) {
              const val = inputEl.value;
              inputEl.value = '';
              handleArbitrarySubmit(val);
            }
          }
        });

        // Boot
        renderApp();
      })();
    </script>
  </body>
</html>
